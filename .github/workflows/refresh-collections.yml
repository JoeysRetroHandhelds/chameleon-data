name: Refresh collections and romhack index

# Two things the app fills in from checksums, rebuilt from their sources so they stay
# current without anyone regenerating them by hand:
#   - collections/curated.json, from the authored sets + hltb data
#   - ra-patches/<shortname>.json, from RetroAchievements' RAPatches repo
# Both read No-Intro dats from libretro-database and use only the Python standard library,
# so there is nothing to install. Weekly, on demand, and whenever a source file changes.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "collections/curated-sources.json"
      - "tools/build-collections.py"
      - "tools/build-rapatches.py"
      - "tools/nointro.py"

permissions:
  contents: write

# Never let two refreshes race to commit the same files.
concurrency:
  group: refresh-collections
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the curated collections
        run: python3 tools/build-collections.py

      - name: Build the romhack index
        run: python3 tools/build-rapatches.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- collections/curated.json ra-patches/; then
            echo "Collections and romhack index already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collections/curated.json ra-patches/
          git commit -m "Refresh collections and romhack index"
          git push
